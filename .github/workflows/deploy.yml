name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two at once, and never cancel one half way through a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/victorchrollo14/maxfit-web

jobs:
  deploy-backend:
    name: Deploy backend (Supabase migrations)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      # No --include-seed: seed.sql is dev data. --include-all: separate PRs can
      # land a migration older than one already applied.
      - run: supabase db push --linked --include-all

  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the backend, so new code never runs against the old schema.
  deploy-web:
    name: Deploy web to EC2
    needs: [deploy-backend, build-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull the new image and restart
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "app.maxfitbangalore.in ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFxeuZZwCNrdedhoCRMRCcEdWqBwHJcNA7j+gwgWvjGe" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy ubuntu@app.maxfitbangalore.in \
            'cd ~/maxfit-gym/apps/web && git pull -q --ff-only && docker compose pull -q && docker compose up -d'

      - name: Check it's up
        run: curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 3 https://app.maxfitbangalore.in/godmode
