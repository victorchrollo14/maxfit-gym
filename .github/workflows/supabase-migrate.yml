name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/supabase/migrations/**'
      - 'apps/backend/supabase/config.toml'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

# A second run pushing migrations while the first is mid-apply is a good way to
# get a half-migrated database. Queue them instead, and never cancel one.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version in apps/backend/package.json — this touches the
      # production database, so it shouldn't change under us on its own.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link the project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # What would run, in the log, before anything runs — the only record of
      # what a deploy was about to change if it then fails half way.
      - name: Plan
        run: supabase db push --linked --dry-run

      # No --include-seed: seed.sql is dev data and must never reach production.
      - name: Apply migrations
        run: supabase db push --linked

      - name: Confirm applied
        run: supabase migration list --linked
